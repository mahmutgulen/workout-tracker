<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens (liquid-glass visual language) ---------- */
  :root{
    color-scheme: dark;
    /* surfaces */
    --bg: #08090C;                  /* bg-base */
    --bg-scrim: rgba(8,9,12,.80);
    --surface: #15171C;             /* surface-1: cards, panels */
    --surface-2: #282C34;           /* surface-2: nested fills, meter tracks */
    --surface-3: #1F232B;           /* surface-3: pressed/hover-on-nested */
    --border: rgba(157,163,176,.16);/* quiet card divider, not full glass-border */
    --glass-fill: rgba(31,35,43,.80);
    --glass-border: rgba(77,81,89,.64);
    --glass-blur: 20px;
    --edge-highlight: rgba(255,255,255,.16);
    --edge-highlight-soft: rgba(255,255,255,.10);
    --hover-overlay: rgba(255,255,255,.04);
    /* neutrals */
    --text: #E0E5EB;                /* n-primary */
    --text-dim: #9DA3B0;            /* n-secondary */
    --text-faint: #5C6069;          /* n-placeholder tone, used for quiet text */
    /* prime accent - aqua (replaces the old orange) */
    --accent: #21B8DC;
    --accent-deep: #0E7E9B;
    --accent-dim: rgba(33,184,220,.14);
    --accent-glow: 0 0 12px rgba(33,184,220,.28);
    --grad-primary: linear-gradient(180deg, #4393F7 0%, #21B8DC 52%, #17A9CE 100%);
    /* success */
    --good: #22C55E;
    --good-dim: rgba(34,197,94,.12);
    /* YouTube brand icon keeps its own recognizable red (not a semantic danger use) */
    --yt-red: #FF7276;
    --yt-red-dim: rgba(255,114,118,.12);
    /* destructive (confirm/reset only) */
    --danger-deep: #D93A3F;
    /* label ink used on light/mid accent fills (primary + success buttons) */
    --ink: #08090C;
    /* radius */
    --radius-lg: 24px;
    --radius-md: 20px;
    --radius-sm: 16px;
    /* type */
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    /* motion */
    --t-fast: 120ms; --t-med: 200ms;
    --ease: cubic-bezier(.2,.7,.3,1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    line-height: 1.35;
    overflow-x: hidden;
    padding-bottom: calc(28px + var(--safe-bottom));
  }
  img{ max-width:100%; display:block; }
  h1,h2,h3,p{ margin:0; }
  button{ font-family:inherit; }
  a{ color: inherit; }

  ::selection{ background: var(--accent-dim); color: var(--text); }
  *{ scrollbar-width: thin; scrollbar-color: var(--surface-2) transparent; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--surface-2); border-radius:999px; }
  ::-webkit-scrollbar-thumb:hover{ background: var(--glass-border); }

  .visually-hidden{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    box-shadow: var(--accent-glow);
  }

  /* Press physics: instant press-in, spring release on the way back out. */
  .pressable{
    transition: transform var(--t-med) var(--ease-spring), box-shadow var(--t-fast) var(--ease);
  }
  .pressable:active{
    transition: none;
    transform: translateY(1px) scale(.985);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.32);
  }

  /* ---------- Header (glass: this is navigation chrome, not content) ---------- */
  .app-header{
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--glass-fill);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border-bottom: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--edge-highlight);
    padding: calc(12px + var(--safe-top)) 16px 12px;
  }
  .header-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .app-title{
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .app-subtitle{
    margin-top: 3px;
    font-size: .8rem;
    color: var(--text-dim);
  }
  .progress-track{
    height: 10px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow:hidden;
    border: 1px solid var(--border);
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--accent-deep), var(--accent));
    border-radius: 999px;
    width:0%;
    transition: width .25s ease;
  }

  /* ---------- Main layout ---------- */
  main{
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 12px 0;
  }

  .day{
    margin-bottom: 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: inset 0 1px 0 var(--edge-highlight-soft);
    overflow: hidden;
  }
  .day > summary{
    list-style:none;
    cursor:pointer;
    padding: 18px 16px;
    min-height: 64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    -webkit-tap-highlight-color: transparent;
    transition: background-color var(--t-fast) var(--ease);
  }
  .day > summary:active{ background: var(--surface-3); }
  .day > summary::-webkit-details-marker{ display:none; }
  .day-title-group h2{
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 700;
  }
  .day-subtitle{
    display:block;
    margin-top:3px;
    font-size: .78rem;
    color: var(--text-dim);
  }
  .day-meta{
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .day-progress-text{
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: .8rem;
    font-weight:600;
    color: var(--text-dim);
    white-space:nowrap;
  }
  .mini-progress{
    width: 72px;
    height: 12px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow:hidden;
    border: 1px solid var(--border);
  }
  .mini-progress-fill{
    height:100%;
    background: var(--accent);
    width:0%;
    transition: width .25s ease;
  }
  .reset-day-btn{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 44px;
    height: 44px;
    border-radius: 999px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1.25rem;
    flex-shrink:0;
    transition: transform var(--t-med) var(--ease-spring), background-color var(--t-fast) var(--ease);
  }
  .reset-day-btn:active{ transition:none; background: var(--surface-3); transform: translateY(1px) scale(.9); }
  .chevron{
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    width: 32px;
    height: 32px;
    border-radius: 999px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .chevron svg{ width:16px; height:16px; }
  /* Disclosure chevron: an instant swap between states, not an animated rotation. */
  .day[open] .chevron{ transform: rotate(180deg); }

  .day-body{
    border-top: 1px solid var(--border);
    padding: 12px 12px 4px;
  }
  .cards{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  /* ---------- Exercise card ----------
     Law: glass is the navigation layer, never the content layer. Cards are
     scrollable content, so they stay a flat --surface (surface-1) with a
     quiet 10%-opacity inset top highlight, never a blurred glass panel. */
  .card{
    display:flex;
    flex-direction:column;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px;
    box-shadow: inset 0 1px 0 var(--edge-highlight-soft);
    transition: background-color .2s ease, border-color .2s ease;
  }
  .card.is-done{
    background: rgba(34,197,94,.07);
    border-color: rgba(34,197,94,.38);
  }

  /* Top region: image + name/sets grouped together */
  .card-top{
    display:flex;
    gap: 12px;
    align-items:flex-start;
  }
  .card-media{
    position:relative;
    width: 88px;
    height: 88px;
    flex-shrink:0;
    border-radius: 14px;
    overflow:hidden;
    background: #101114;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--text-faint);
    padding:0;
    margin:0;
    border:0;
    font: inherit;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform var(--t-med) var(--ease-spring);
  }
  .card-media:active{ transition:none; transform: scale(.97); }
  .card-media img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: cover;
  }
  .card-media-zoom-badge{
    position:absolute;
    right:4px;
    bottom:4px;
    width:22px;
    height:22px;
    border-radius:999px;
    background: rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    pointer-events:none;
  }
  .card-media-zoom-badge svg{ width:12px; height:12px; }
  .card-heading{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap: 3px;
    padding-top: 1px;
  }
  .ex-name{
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 700;
    line-height:1.28;
    overflow-wrap: anywhere;
  }
  .focus-badge{
    display:inline-block;
    margin-left:6px;
    vertical-align:middle;
    background: var(--accent-dim);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: .6rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 6px;
    white-space:nowrap;
  }
  .ex-sets-prominent{
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: .84rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: .02em;
    line-height:1.2;
  }

  /* ---------- Collapsible exercise info: full-width, quiet secondary control ----------
     Nested one level inside the card's own --surface, so it takes the next
     step up the ramp (--surface-2) to read as a distinct inner block. */
  .ex-info{ }
  .ex-info > summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    width:100%;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    min-height: 40px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 12px;
    font-family: var(--font-ui);
    font-size: .76rem;
    font-weight: 600;
    color: var(--text-dim);
    -webkit-tap-highlight-color: transparent;
    transition: background-color var(--t-fast) var(--ease);
  }
  .ex-info > summary:active{ background: var(--surface-3); }
  .ex-info > summary::-webkit-details-marker{ display:none; }
  .ex-info[open] > summary{
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    border-bottom-color: transparent;
  }
  .ex-info-chevron{
    display:inline-flex;
    flex-shrink:0;
    color: var(--text-faint);
  }
  .ex-info-chevron svg{ width:14px; height:14px; }
  /* Instant swap between closed/open, not an animated rotation. */
  .ex-info[open] .ex-info-chevron{ transform: rotate(180deg); }
  .ex-info-body{
    padding: 10px 12px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    display:flex;
    flex-direction:column;
    gap: 4px;
  }
  .ex-info-body p{
    font-size: .78rem;
    color: var(--text-dim);
    line-height:1.4;
  }
  .ex-info-body strong{
    color: var(--text);
  }
  .ex-info-meta{
    margin-top: 2px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: .7rem;
    color: var(--text-faint);
  }

  /* ---------- Action row: right-aligned, compact YouTube (secondary) + Completion (primary) ----------
     .action-pair uses an inline CSS grid with two equal (1fr) columns sized to fit-content.
     This makes both buttons come out exactly the same width regardless of font metrics/device -
     the wider label (Videoyu İzle) sets the shared column width and the shorter one (Tamamla/BASILDI)
     stretches to match it, instead of relying on a guessed fixed pixel width. */
  .card-actions{
    display:flex;
    justify-content:flex-end;
  }
  .action-pair{
    display:inline-grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  /* Secondary / Neutral variant: quiet surface-2 chip, brand-red YouTube icon kept as-is. */
  .yt-btn{
    width:100%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-ui);
    font-size: .78rem;
    font-weight: 600;
    padding-inline: 16px;
    border-radius: 999px;
    text-decoration:none;
    min-height: 44px;
    white-space:nowrap;
    transition: transform var(--t-med) var(--ease-spring), background-color var(--t-fast) var(--ease);
  }
  .yt-btn svg{ color: var(--yt-red); flex-shrink:0; }
  .yt-btn:active{ transition:none; background: var(--surface-3); transform: translateY(1px) scale(.985); }
  /* Primary variant: the gloss --grad-primary fill + edge highlight is the primary's alone. */
  .done-btn{
    width:100%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    background: var(--grad-primary);
    border: 1px solid transparent;
    box-shadow: inset 0 1px 0 var(--edge-highlight);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .02em;
    padding-inline: 16px;
    border-radius: 999px;
    min-height: 44px;
    white-space:nowrap;
    transition: transform var(--t-med) var(--ease-spring);
  }
  .done-btn:active{
    transition:none;
    transform: translateY(1px) scale(.985);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.32);
  }
  .done-dot{
    width: 16px;
    height: 16px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: transparent;
  }
  .done-dot svg{ opacity:0; width:10px; height:10px; }
  .done-btn[aria-checked="true"]{
    background: var(--good);
    box-shadow: inset 0 1px 0 var(--edge-highlight);
    color: var(--ink);
  }
  .done-btn[aria-checked="true"] .done-dot{
    background: var(--ink);
    border-color: var(--ink);
  }
  .done-btn[aria-checked="true"] .done-dot svg path{ fill: var(--good); }
  .done-btn[aria-checked="true"] .done-dot svg{ opacity:1; }

  .card.is-done .ex-name{
    color: var(--text-dim);
  }

  /* ---------- About / info section ---------- */
  .info{
    margin: 18px 0 6px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: inset 0 1px 0 var(--edge-highlight-soft);
    overflow:hidden;
  }
  .info > summary{
    list-style:none;
    cursor:pointer;
    padding: 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: .96rem;
  }
  .info > summary::-webkit-details-marker{ display:none; }
  .info[open] .chevron{ transform: rotate(180deg); }
  .info-body{
    border-top: 1px solid var(--border);
    padding: 14px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .info-block h3{
    font-family: var(--font-mono);
    font-size: .72rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .info-block ul{
    margin:0;
    padding-left: 18px;
    font-size: .82rem;
    color: var(--text-dim);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .info-block p{
    font-size: .82rem;
    color: var(--text-dim);
  }
  .progression-example{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: .8rem;
    color: var(--text);
  }
  .progression-example code{
    display:block;
    margin-top:6px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: .78rem;
  }

  /* ---------- Final overall progress (bottom) ---------- */
  .final-progress{
    margin: 22px 0 8px;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: inset 0 1px 0 var(--edge-highlight-soft);
    text-align:center;
  }
  .final-progress-title{
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 700;
  }
  .final-progress-count{
    margin-top: 4px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: .84rem;
    color: var(--text-dim);
  }
  .final-progress-track{
    margin-top: 14px;
    height: 16px;
  }
  .final-reset-btn{
    margin-top: 18px;
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 14px;
    font-family: var(--font-ui);
    font-size: .92rem;
    font-weight: 600;
    min-height: 50px;
    transition: transform var(--t-med) var(--ease-spring), background-color var(--t-fast) var(--ease);
  }
  .final-reset-btn:active{ transition:none; background: var(--surface-3); transform: translateY(1px) scale(.99); }

  /* ---------- Confirm overlay ---------- */
  .overlay{
    position: fixed;
    inset:0;
    background: var(--bg-scrim);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index: 50;
    padding: 16px;
    padding-bottom: calc(16px + var(--safe-bottom));
  }
  .overlay[hidden]{ display:none; }
  /* Modal: glass recipe + true elevation shadow - this is a floating layer, not content. */
  .confirm-box{
    width:100%;
    max-width: 420px;
    background: var(--glass-fill);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    box-shadow: inset 0 1px 0 var(--edge-highlight), 0 16px 48px rgba(0,0,0,.56);
    padding: 18px;
  }
  .confirm-box h3{
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .confirm-box p{
    font-size: .84rem;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .confirm-actions{
    display:flex;
    gap: 10px;
  }
  .btn{
    flex:1;
    padding: 12px;
    border-radius: 999px;
    font-family: var(--font-ui);
    font-size: .88rem;
    font-weight: 600;
    border: 1px solid var(--border);
    min-height: 44px;
    transition: transform var(--t-med) var(--ease-spring), background-color var(--t-fast) var(--ease);
  }
  .btn:active{ transition:none; transform: translateY(1px) scale(.985); }
  .btn-secondary{

        '</details>' +
        '<div class="card-actions">' +
          '<div class="action-pair">' +
            '<a class="yt-btn" href="' + ytUrl + '" target="_blank" rel="noopener noreferrer" aria-label="' + ex.name + ' video gösterimini izle">' +
              YT_ICON + '<span>Videoyu İzle</span>' +
            '</a>' +
            '<button type="button" class="done-btn" role="switch" aria-checked="' + done + '" data-id="' + ex.id + '" aria-label="' + ex.name + ' tamamlandı olarak işaretle">' +
              '<span class="done-dot">' + CHECK_ICON + '</span>' +
              '<span class="done-label">' + (done ? "BASILDI" : "Tamamla") + '</span>' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</article>'
    );
  }

  function dayHtml(day){
    var cards = day.exercises.map(function(ex){ return cardHtml(day, ex); }).join("");
    var isOpen = dayOpenState[day.id] === true;
    return (
      '<details class="day" id="day-' + day.id + '"' + (isOpen ? " open" : "") + '>' +
        '<summary>' +
          '<div class="day-title-group">' +
            '<h2>' + day.title + '</h2>' +
            '<span class="day-subtitle">' + day.subtitle + '</span>' +
          '</div>' +
          '<div class="day-meta">' +
            '<span class="day-progress-text" id="day-progress-text-' + day.id + '">0/' + day.exercises.length + '</span>' +
            '<div class="mini-progress"><div class="mini-progress-fill" id="day-progress-fill-' + day.id + '"></div></div>' +
            '<button type="button" class="reset-day-btn" data-day="' + day.id + '" aria-label="' + day.title + ' gününü sıfırla">↺</button>' +
            '<span class="chevron" aria-hidden="true">' + CHEVRON_ICON + '</span>' +
          '</div>' +
        '</summary>' +
        '<div class="day-body">' +
          '<div class="cards" id="cards-' + day.id + '">' + cards + '</div>' +
        '</div>' +
      '</details>'
    );
  }

  daysContainer.innerHTML = PROGRAM.map(dayHtml).join("");

  PROGRAM.forEach(function(day){
    var dayEl = document.getElementById("day-" + day.id);
    dayEl.addEventListener("toggle", function(){
      dayOpenState[day.id] = dayEl.open;
      saveDayState();
    });
  });

  var infoTemplate = document.getElementById("info-template");
  daysContainer.parentNode.insertBefore(infoTemplate.content.cloneNode(true), document.getElementById("final-progress"));

  /* ============ Progress updates ============ */
  var overallCountEl = document.getElementById("overall-count");
  var overallFillEl = document.getElementById("overall-fill");

  function updateProgressUI(){
    var totalAll = 0, doneAll = 0;
    PROGRAM.forEach(function(day){
      var total = day.exercises.length;
      var done = day.exercises.reduce(function(acc, ex){ return acc + (progress[ex.id] ? 1 : 0); }, 0);
      totalAll += total;
      doneAll += done;

      var pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("day-progress-text-" + day.id).textContent = done + "/" + total;
      document.getElementById("day-progress-fill-" + day.id).style.width = pct + "%";
    });

    var overallPct = totalAll ? Math.round((doneAll / totalAll) * 100) : 0;
    overallCountEl.textContent = doneAll + " / " + totalAll + " hareket tamamlandı";
    overallFillEl.style.width = overallPct + "%";
  }

  function setExerciseDone(id, done){
    progress[id] = done;
    saveProgress();

    var card = document.getElementById("card-" + id);
    var btn = card.querySelector(".done-btn");
    var label = btn.querySelector(".done-label");

    card.classList.toggle("is-done", done);
    btn.setAttribute("aria-checked", String(done));
    label.textContent = done ? "BASILDI" : "Tamamla";

    updateProgressUI();
  }

  daysContainer.addEventListener("click", function(e){
    var doneBtn = e.target.closest(".done-btn");
    if (doneBtn){
      var id = doneBtn.getAttribute("data-id");
      setExerciseDone(id, doneBtn.getAttribute("aria-checked") !== "true");
      return;
    }

    var mediaBtn = e.target.closest(".card-media");
    if (mediaBtn){
      openImageModal(mediaBtn.getAttribute("data-img"), mediaBtn.getAttribute("data-name"));
      return;
    }

    var resetDayBtn = e.target.closest(".reset-day-btn");
    if (resetDayBtn){
      e.preventDefault();
      e.stopPropagation();
      var dayId = resetDayBtn.getAttribute("data-day");
      var day = PROGRAM.filter(function(d){ return d.id === dayId; })[0];
      askConfirm(
        day.title + " gününü sıfırla",
        "Bu güne ait " + day.exercises.length + " egzersizin tamamlanma durumu sıfırlanacak. Bu işlem geri alınamaz.",
        function(){
          day.exercises.forEach(function(ex){ setExerciseDone(ex.id, false); });
        }
      );
    }
  });

  /* ============ Reset all ============ */
  document.getElementById("reset-all-btn").addEventListener("click", function(){
    askConfirm(
      "Tüm ilerlemeyi sıfırla",
      "Programdaki tüm günlerin tamamlanma durumu sıfırlanacak. Bu işlem geri alınamaz.",
      function(){
        PROGRAM.forEach(function(day){
          day.exercises.forEach(function(ex){ setExerciseDone(ex.id, false); });
        });
      }
    );
  });

  /* ============ Confirm dialog ============ */
  var overlay = document.getElementById("confirm-overlay");
  var confirmTitle = document.getElementById("confirm-title");
  var confirmDesc = document.getElementById("confirm-desc");
  var confirmOk = document.getElementById("confirm-ok");
  var confirmCancel = document.getElementById("confirm-cancel");
  var lastFocused = null;

  function askConfirm(title, desc, onConfirm){
    lastFocused = document.activeElement;
    confirmTitle.textContent = title;
    confirmDesc.textContent = desc;
    overlay.hidden = false;
    confirmCancel.focus();

    function cleanup(){
      overlay.hidden = true;
      confirmOk.removeEventListener("click", onOk);
      confirmCancel.removeEventListener("click", onCancel);
      document.removeEventListener("keydown", onKeydown);
      if (lastFocused) lastFocused.focus();
    }
    function onOk(){ cleanup(); onConfirm(); }
    function onCancel(){ cleanup(); }
    function onKeydown(e){ if (e.key === "Escape") onCancel(); }

    confirmOk.addEventListener("click", onOk);
    confirmCancel.addEventListener("click", onCancel);
    document.addEventListener("keydown", onKeydown);
  }

  overlay.addEventListener("click", function(e){
    if (e.target === overlay) confirmCancel.click();
  });

  /* ============ Fullscreen image viewer ============
     Native pinch-to-zoom is left enabled (no touch-action:none anywhere) so
     mobile users can always zoom with two fingers. A lightweight, dependency-free
     tap-to-zoom + drag-to-pan is layered on top for mouse users and quick taps.
  */
  var imgModal = document.getElementById("img-modal");
  var imgModalViewport = document.getElementById("img-modal-viewport");
  var imgModalImg = document.getElementById("img-modal-img");
  var imgModalClose = document.getElementById("img-modal-close");
  var imgModalLastFocused = null;
  var zoomScale = 1, zoomX = 0, zoomY = 0;
  var dragging = false, dragStartX = 0, dragStartY = 0, dragOriginX = 0, dragOriginY = 0;

  function applyZoomTransform(){
    imgModalImg.style.transform = "translate(" + zoomX + "px," + zoomY + "px) scale(" + zoomScale + ")";
    imgModalImg.classList.toggle("is-zoomed", zoomScale > 1);
  }

  function resetZoom(){
    zoomScale = 1; zoomX = 0; zoomY = 0;
    imgModalImg.style.transformOrigin = "center center";
    applyZoomTransform();
  }

  function openImageModal(src, name){
    imgModalLastFocused = document.activeElement;
    imgModalImg.src = src;
    imgModalImg.alt = name + " hareketinin büyütülmüş görseli";
    resetZoom();
    imgModal.hidden = false;
    imgModalClose.focus();
    document.addEventListener("keydown", onImgModalKeydown);
  }

  function closeImageModal(){
    imgModal.hidden = true;
    resetZoom();
    document.removeEventListener("keydown", onImgModalKeydown);
    if (imgModalLastFocused) imgModalLastFocused.focus();
  }

  function onImgModalKeydown(e){
    if (e.key === "Escape") closeImageModal();
  }

  imgModalClose.addEventListener("click", closeImageModal);

  imgModal.addEventListener("click", function(e){
    if (e.target === imgModal || e.target === imgModalViewport) closeImageModal();
  });

  // Tap/click toggles a fixed zoom level, centered on the tap point.
  imgModalImg.addEventListener("click", function(e){
    if (dragging) return;
    if (zoomScale > 1){
      resetZoom();
      return;
    }
    var rect = imgModalImg.getBoundingClientRect();
    var originX = ((e.clientX - rect.left) / rect.width) * 100;
    var originY = ((e.clientY - rect.top) / rect.height) * 100;
    imgModalImg.style.transformOrigin = originX + "% " + originY + "%";
    zoomScale = 2.5;
    applyZoomTransform();
  });

  // Simple single-pointer drag-to-pan while zoomed (does not block native pinch-zoom).
  imgModalImg.addEventListener("pointerdown", function(e){
    if (zoomScale <= 1) return;
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragOriginX = zoomX;
    dragOriginY = zoomY;
    imgModalImg.setPointerCapture(e.pointerId);
  });
  imgModalImg.addEventListener("pointermove", function(e){
    if (!dragging) return;
    zoomX = dragOriginX + (e.clientX - dragStartX);
    zoomY = dragOriginY + (e.clientY - dragStartY);
    applyZoomTransform();
  });
  function endDrag(){ dragging = false; }
  imgModalImg.addEventListener("pointerup", endDrag);
  imgModalImg.addEventListener("pointercancel", endDrag);

  /* ============ Init ============ */
  updateProgressUI();
})();
</script>
</body>
</html>
